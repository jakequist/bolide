name: release

# Push a tag `vX.Y.Z` whose version matches the workspace's Cargo.toml, and this builds
# bolide for every released target and publishes a GitHub release with:
#
#   bolide-X.Y.Z-<target>.tar.gz   one per target, a single `bolide` at the archive root
#   install.sh                     the installer, as it was at this tag
#
# That tarball shape and naming is what install.sh downloads and what `bolide update`
# unpacks (crates/bolide-cli/src/update.rs: asset_name) — change one, change all three.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: The tag must match the Cargo version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "bolide-cli") | .version')"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the workspace version ${crate_version} in Cargo.toml." >&2
            echo "Set [workspace.package] version = \"${tag_version}\", commit, then retag:" >&2
            echo "  git tag -d ${GITHUB_REF_NAME} && git push origin :${GITHUB_REF_NAME}" >&2
            echo "  git tag ${GITHUB_REF_NAME} && git push origin ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "Releasing bolide ${tag_version}."

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash scripts/install-selftest.sh

  build:
    needs: verify
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          # Cross-compiled on the arm64 runner: Apple's toolchain links both
          # architectures, and the Intel runner images are being retired.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # The runner has no aarch64 musl linker; `cross` builds in an image that does.
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked -p bolide-cli --target ${{ matrix.target }}
          else
            cargo build --release --locked -p bolide-cli --target ${{ matrix.target }}
          fi

      # The native builds can prove themselves; a cross-compiled one is checked by type.
      - name: Smoke
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/bolide"
          file "$bin"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin | x86_64-unknown-linux-musl) "$bin" --version ;;
          esac

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/bolide" "$staging/bolide"
          tar -czf "bolide-${version}-${{ matrix.target }}.tar.gz" -C "$staging" bolide
          ls -l "bolide-${version}-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: bolide-${{ matrix.target }}
          path: bolide-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bolide-*
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            install.sh
