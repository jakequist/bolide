[package]
name = "bolide-cli"
description = "bolide — connect to any VNC/RFB desktop and drive it as a computer-use endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "bolide_cli"
path = "src/lib.rs"

[[bin]]
name = "bolide"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
bolide-rfb.workspace = true
bolide-server.workspace = true
libc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
bolide-testkit.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "time", "net"] }
